```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Venta x Void</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090d;
      color: #fff;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .container {
      width: 90%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: -1.5px;
    }

    .description {
      color: #9999a5;
      font-size: 16px;
      margin-bottom: 34px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .button {
      width: 100%;
      padding: 17px 20px;
      border: 1px solid #24242d;
      border-radius: 14px;
      background: #111117;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #181820;
      border-color: #3a3a47;
    }

    .button:active {
      transform: translateY(0);
    }

    .void {
      border-left: 3px solid #7c5cff;
    }

    .venta {
      border-left: 3px solid #4da3ff;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>안녕하세요, Team Venta x Void</h1>
    <p class="description">이동할 섹션을 선택하세요.</p>

    <div class="buttons">
      <button class="button void" onclick="location.href='/voidbot'">
        보이드봇
      </button>

      <button class="button venta" onclick="location.href='/ventabot'">
        벤타봇
      </button>
    </div>
  </main>

</body>
</html>
