<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} | Venta × Void</title>
    <meta
      name="description"
      content="봇별 서비스 이용 조건과 구매, 환불 및 지원 안내입니다."
    />
    <link rel="canonical" href="https://kakaobot.xyz{{ page.permalink }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta
      property="og:title"
      content="{{ page.title | escape }} | Venta × Void"
    />
    <meta
      property="og:description"
      content="봇별 서비스 이용 조건과 구매, 환불 및 지원 안내입니다."
    />
    <meta
      property="og:url"
      content="https://kakaobot.xyz{{ page.permalink }}"
    />
    <meta
      property="og:image"
      content="https://kakaobot.xyz/og-image.png?v=heart-20260918"
    />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta
      property="og:image:alt"
      content="검은 배경 위에 손으로 그린 흰색 하트"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://kakaobot.xyz/og-image.png?v=heart-20260918"
    />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="nav">
      <div class="wrap nav-inner">
        <a class="brand" href="/" aria-label="Venta x Void 홈"
          >Venta <span>×</span> Void</a
        >
        <nav class="nav-links" aria-label="주 메뉴">
          <a href="/#collection">봇 둘러보기</a><a href="/terms/">이용약관</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <section class="terms-hero">
        <p class="eyebrow">TERMS OF SERVICE</p>
        <h1>{{ page.title | escape }}</h1>
        <p>구매 전 확인해야 할 서비스 이용 조건입니다.</p>
        <nav class="terms-tabs" aria-label="봇별 이용약관">
          <a href="/terms/ventabot/" {% if page.bot == 'ventabot' %}aria-current="page"{% endif %}>밴타봇</a>
          <a href="/terms/voidbot/" {% if page.bot == 'voidbot' %}aria-current="page"{% endif %}>보이드봇</a>
        </nav>
      </section>
      <article class="wrap legal">
        <div class="legal-meta">
          시행일 {{ page.effective_date | date: '%Y.%m.%d' }} · 최종 수정 {{
          page.updated | date: '%Y.%m.%d' }}
        </div>
        {{ content }}
        <p><a href="/{{ page.bot }}/">구매 안내로 돌아가기 →</a></p>
      </article>
    </main>
    <footer class="footer">
      <div class="wrap footer-inner">
        <span>© Team Venta × Void</span>
        <nav class="footer-links" aria-label="하단 메뉴">
          <a href="/terms/ventabot/">밴타봇 약관</a
          ><a href="/terms/voidbot/">보이드봇 약관</a
          ><a href="https://open.kakao.com/o/gTHTnqNi">문의하기 ↗</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
